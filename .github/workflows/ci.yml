name: ci

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the code. Saying so explicitly means a compromised
# dependency running inside a test cannot use the job's token to write to the
# repository — without this line the token carries whatever the repository
# default happens to be, which is not a decision anyone made per-workflow.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The runtime floor is engines >=20; 24 is what development happens on.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          # Without this the suite would try to open browser tabs on the runner.
          TRIAGO_NO_BROWSER: "1"

      # Advisories in the tree users actually install (--omit=dev). The gate sits
      # at critical rather than high on purpose: a high advisory can exist with no
      # published fix — one does today, see SECURITY.md — and a build that cannot
      # be made green teaches people to ignore it. The full report always prints,
      # and Dependabot raises the rest as PRs.
      - name: Audit the shipped dependency tree
        if: matrix.node == '24'
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical
