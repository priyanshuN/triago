name: ci

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the code. Saying so explicitly means a compromised
# dependency running inside a test cannot use the job's token to write to the
# repository — without this line the token carries whatever the repository
# default happens to be, which is not a decision anyone made per-workflow.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The runtime floor is engines >=20; 24 is what development happens on.
        node: ["20", "22", "24"]
        # Windows is a platform question, not a runtime one, so it runs once on
        # the development version rather than across the whole node matrix.
        # It is here because issue #7 — a launcher that could never work on
        # Windows, reporting that it had — stayed open for want of a machine to
        # check it on, and a hosted runner is that machine. What it proves is
        # bounded: that the suite runs, that path handling and ~/.triago behave,
        # and that the launcher is a real executable. Whether a tab actually
        # appears is still unverified, and the code no longer claims it did.
        include:
          - os: windows-latest
            node: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Style is decided by a formatter so it never has to be decided in review.
      # One node version is enough — the answer cannot differ between them.
      - run: npm run format:check
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          # Belt and braces: test/preload.mjs sets this too, so the suite is safe
          # to run by hand. Stated here as well because a runner opening tabs is
          # the failure this must never have.
          TRIAGO_NO_BROWSER: "1"

      # Advisories in the tree users actually install (--omit=dev). The gate sits
      # at critical rather than high on purpose: a high advisory can exist with no
      # published fix — one does today, see SECURITY.md — and a build that cannot
      # be made green teaches people to ignore it. The full report always prints,
      # and Dependabot raises the rest as PRs.
      - name: Audit the shipped dependency tree
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical
