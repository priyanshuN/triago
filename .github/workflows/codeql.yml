name: codeql

# Static analysis for the classes of bug that matter in this codebase: path
# handling on the static route and the editor deep-link, and anything that
# reaches a shell. Findings land in the repository's Security tab, which is
# public for a public repo — so it is a claim a stranger can check rather than
# one the README makes about itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the analysis improves even when the code does not.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Uploading results needs code scanning, which a private repository only has
    # with Advanced Security. The analysis itself runs fine there — it is the
    # upload that is refused — so while this repo is private the job would go red
    # every push for a reason no commit can fix, and a permanently red check is
    # one people learn to scroll past. It switches itself on when the repo is.
    if: github.event.repository.private != true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity rules; on a codebase this size
          # the extra noise is affordable and the point is to catch things early.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
