name: publish

# Publishing happens here rather than from a laptop so npm can attach a
# provenance attestation: a verifiable link from the published tarball back to
# the exact public commit and workflow that produced it. For a tool that asks
# people to run a local server holding a token, "trust me, I built it" is a
# weaker claim than a signed one.
#
# There is no npm credential in this repository. The registry is configured to
# trust this workflow, by filename, in this repository (npm "trusted publishing"),
# and authenticates it with a short-lived OIDC token minted per run by the
# id-token permission below. Nothing to rotate, nothing to expire, and nothing a
# leaked repository secret could be used to publish with.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish (leave off for a rehearsal)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # mints the OIDC token: both the registry auth and the provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          TRIAGO_NO_BROWSER: "1"

      - name: Release tag and package version must agree
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag ($tag) does not match package.json ($pkg)"
            exit 1
          fi

      # Only gate the real thing: a rehearsal must be able to run while the
      # package is still private, which is exactly when you would rehearse.
      - name: Refuse to publish while the package is marked private
        if: github.event_name == 'release' || inputs.publish
        run: |
          node -e "if (require('./package.json').private) {
            console.error('package.json still has \"private\": true — remove it deliberately before releasing');
            process.exit(1);
          }"

      # No NODE_AUTH_TOKEN: authentication is the OIDC token minted above. A
      # stored token would take precedence over it, so its absence is what keeps
      # this on the trusted-publishing path rather than a credential that can
      # leak or expire. --access public is still required: scoped packages
      # default to restricted, which a free account cannot publish.
      - name: Publish with provenance
        if: github.event_name == 'release' || inputs.publish
        run: npm publish --provenance --access public

      - name: Rehearsal only — nothing was published
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: echo "Build, typecheck and tests passed. Re-run with publish=true, or cut a release."
